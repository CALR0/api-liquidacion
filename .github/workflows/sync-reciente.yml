name: Sync reciente (mes actual)

# Corre cada 20 minutos: refresca el mes anterior + el mes en curso en Supabase (sync.py, MODE=reciente).
# GitHub Actions es el "cron": solo consume minutos mientras corre (no hay servidor prendido).
on:
  # Schedule nativo de GitHub (best-effort; puede retrasarse). Se deja como respaldo.
  # El disparo PUNTUAL lo hace un cron externo (cron-job.org) llamando a workflow_dispatch (ver README).
  schedule:
    # UTC. Colombia (UTC-5): 8 a.m. y 2 p.m. => 13:00 y 19:00 UTC.
    - cron: "0 13,19 * * *"
  workflow_dispatch: {}

concurrency:
  group: sync-liquidacion     # evita corridas solapadas (dos logins a la vez)
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODE: reciente
      SILOGTRAN_USUARIO: ${{ secrets.SILOGTRAN_USUARIO }}
      SILOGTRAN_CLAVE: ${{ secrets.SILOGTRAN_CLAVE }}
      SILOGTRAN_CENTROCOSTO: ${{ secrets.SILOGTRAN_CENTROCOSTO }}
      SILOGTRAN_URL: ${{ secrets.SILOGTRAN_URL || 'https://construproyec.colombiasoftware.net' }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python sync.py
