<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Cerrar corte</title>
  <style>
    body { font: 14px system-ui, sans-serif; width: 290px; margin: 0; padding: 16px; color: #1f2328; }
    h1 { font-size: 15px; margin: 0 0 12px; }
    h2 { font-size: 13px; margin: 18px 0 8px; color: #59636e; }
    button { width: 100%; padding: 10px; font-size: 15px; font-weight: 600; border: 0; border-radius: 6px;
             background: #1f6feb; color: #fff; cursor: pointer; }
    button:disabled { background: #8c959f; cursor: default; }
    button.secundario { background: #1a7f37; margin-top: 10px; }
    #estado, #estadoDescarga { margin-top: 10px; min-height: 18px; line-height: 1.4; }
    .ok { color: #1a7f37; } .error { color: #cf222e; }
    a { color: #0969da; }
    .fila { display: flex; gap: 8px; }
    .fila input { flex: 1; min-width: 0; padding: 8px; font: inherit; border: 1px solid #d1d9e0; border-radius: 6px; }
    .fila button { width: auto; padding: 8px 12px; font-size: 14px; }
    #opciones { display: block; margin-top: 14px; font-size: 12px; text-align: right; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Corte de liquidación</h1>
  <button id="cerrar">▶ Cerrar corte</button>
  <div id="estado"></div>
  <button id="descargarUltimo" class="secundario" hidden></button>

  <h2>Descargar un corte</h2>
  <div class="fila">
    <input id="numero" type="number" min="1" placeholder="N.º de corte">
    <button id="descargar">⬇ Excel</button>
  </div>
  <div id="estadoDescarga"></div>

  <a id="opciones" href="#">Opciones</a>
  <script src="github.js"></script>
  <script src="xlsx.js"></script>
  <script src="exportar.js"></script>
  <script src="popup.js"></script>
</body>
</html>
