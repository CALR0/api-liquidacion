<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Cerrar corte</title>
  <style>
    body { font: 14px system-ui, sans-serif; width: 280px; margin: 0; padding: 16px; color: #1f2328; }
    h1 { font-size: 15px; margin: 0 0 12px; }
    button { width: 100%; padding: 10px; font-size: 15px; font-weight: 600; border: 0; border-radius: 6px;
             background: #1f6feb; color: #fff; cursor: pointer; }
    button:disabled { background: #8c959f; cursor: default; }
    #estado { margin-top: 12px; min-height: 20px; line-height: 1.4; }
    .ok { color: #1a7f37; } .error { color: #cf222e; }
    a { color: #0969da; }
    #opciones { display: block; margin-top: 12px; font-size: 12px; text-align: right; }
  </style>
</head>
<body>
  <h1>Corte de liquidación</h1>
  <button id="cerrar">▶ Cerrar corte</button>
  <div id="estado"></div>
  <a id="opciones" href="#">Opciones</a>
  <script src="github.js"></script>
  <script src="popup.js"></script>
</body>
</html>
