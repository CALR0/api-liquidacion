<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Opciones · Cerrar corte</title>
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 480px; margin: 24px auto; padding: 0 16px; color: #1f2328; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input { width: 100%; padding: 8px; box-sizing: border-box; font: inherit; }
    small { color: #59636e; }
    button { margin-top: 16px; padding: 8px 16px; font: inherit; font-weight: 600; border: 0; border-radius: 6px;
             background: #1f6feb; color: #fff; cursor: pointer; }
    #guardado { margin-left: 8px; color: #1a7f37; }
  </style>
</head>
<body>
  <h2>Cerrar corte de liquidación</h2>

  <label for="token">Token de GitHub</label>
  <input id="token" type="password" autocomplete="off">
  <small>Fine-grained, solo del repositorio, permiso <b>Actions: Read and write</b>. Se guarda solo en este equipo.</small>

  <label for="origen">Tu nombre</label>
  <input id="origen" placeholder="ej. Laura (liquidaciones)">
  <small>Queda registrado en cada corte.</small>

  <label for="repo">Repositorio</label>
  <input id="repo">

  <button id="guardar">Guardar</button><span id="guardado"></span>
  <script src="github.js"></script>
  <script src="options.js"></script>
</body>
</html>
